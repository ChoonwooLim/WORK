# orbitron:manual — 이 파일은 수동 관리됨. Orbitron이 덮어쓰기/삭제하지 않는다.
# 00-orbitron-cache.conf — Orbitron 생성 vhost들이 공유하는 정적 자산 캐시 기본값 (단일 튜닝 지점)
#
# 생성된 conf의 static-assets location은 `add_header Cache-Control $orbitron_static_cc;`
# 로 이 map을 참조한다. map은 http 컨텍스트 지시어 — conf.d include 전체에서 여기 1회만 정의.
#
# 의미론 (nginx는 add_header 값이 빈 문자열이면 헤더 자체를 생략한다):
#   - 업스트림이 Cache-Control을 안 보냄('')                → 아래 기본값 부여 (public 1일)
#   - 업스트림이 뭐든 보냄(private/no-store/immutable/…)     → 빈 값 → 헤더 생략 → 업스트림 값 그대로 통과
#   → 인증된 개인화 자산(/avatar.png 등)이 Cloudflare 엣지에 public 캐시되는 사고를 방지.
#
# TTL 메모:
#   - max-age는 브라우저 + Cloudflare 엣지 TTL 양쪽에 적용된다 (origin cache control).
#   - 브라우저 캐시는 배포 후 퍼지가 불가능하므로 짧은 1일(86400)을 기본으로 한다.
#   - stale-while-revalidate는 브라우저 전용 — Cloudflare 엣지는 무시한다.

map $upstream_http_cache_control $orbitron_static_cc {
    ''      'public, max-age=86400, stale-while-revalidate=86400';
    default '';
}
