# orbitron:manual — 이 파일은 수동 관리됨. Orbitron이 덮어쓰기/삭제하지 않는다.
# IGOS — MinIO presigned URL 공개 경유지 (수동 등록 — 자체 compose 스택 ~/igos)
# 경로: Cloudflare 엣지 → 본 vhost(HTTP 80) → IGOS Caddy(9443, 내부 CA) → igos-minio
# 주의: Cloudflare 프록시 경유 시 업로드 본문 100MB 제한 (CF Free 플랜)
server {
    listen 80;
    server_name igos-s3.twinverse.org;

    client_max_body_size 512M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass https://192.168.219.101:9443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name igos-s3.twinverse.org;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # presigned PUT 대용량 스트리밍
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
