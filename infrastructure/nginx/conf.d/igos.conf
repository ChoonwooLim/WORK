# IGOS — 가족 이민 플랫폼 포털 (수동 등록 — Orbitron PaaS 아님, 자체 compose 스택 ~/igos)
# 경로: Cloudflare 엣지(TLS 종단) → 본 vhost(HTTP 80) → IGOS Caddy(8443, 내부 CA) → web/api
# IGOS 측 라우팅 규칙(/api·/ws·캐시 헤더)은 전부 IGOS Caddy가 담당 — 여기선 통과만.
server {
    listen 80;
    server_name igos.twinverse.org;

    client_max_body_size 50M;

    # Let's Encrypt HTTP-01 challenge — served from shared webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass https://192.168.219.101:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name igos.twinverse.org;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
